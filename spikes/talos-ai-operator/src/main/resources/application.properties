server.port=8080

# --- Local, OFFLINE GGUF (air-gapped) ------------------------------------
# file:// url + filename => explicit local path; this takes precedence over any
# hf-id, so the model is NEVER downloaded at runtime. The GGUF is baked into the
# image at /models/<filename> at BUILD time (see Dockerfile MODEL_URL build arg).
# MODEL_FILENAME is injected by the image (default: Qwen2.5-3B-Instruct q4_k_m).
llamacpp.model.filename=${MODEL_FILENAME:qwen2.5-3b-instruct-q4_k_m.gguf}
llamacpp.model.url=file:///models/${MODEL_FILENAME:qwen2.5-3b-instruct-q4_k_m.gguf}
llamacpp.model.cache-dir=/models

# CPU inference tuning — overridable by env at deploy time.
llamacpp.model.context-size=${MODEL_CONTEXT_SIZE:8192}
llamacpp.model.threads=${MODEL_THREADS:6}
llamacpp.model.temperature=${MODEL_TEMPERATURE:0.2}

# --- platform-sre tool exec ----------------------------------------------
platformsre.scripts-dir=/opt/platform-sre/scripts
platformsre.tool-timeout-seconds=240

# --- Optional bearer token (gate is registered only when this is set) -----
# Wired from the AIOP_AUTH_TOKEN env var (Helm Secret). Empty => open in-cluster.
aiop.auth.token=${AIOP_AUTH_TOKEN:}

# --- Actuator: readiness gated on the model being READY -------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
