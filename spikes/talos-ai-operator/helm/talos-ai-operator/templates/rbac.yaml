{{- if .Values.rbac.create -}}
# Read-only ClusterRole: get/list/watch ONLY. The operator inspects the cluster;
# it never mutates it. (Remediation, when used at all, is done via a GitOps PR
# outside this workload.)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "talos-ai-operator.fullname" . }}-readonly
  labels:
    {{- include "talos-ai-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/healthz", "/version", "/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "talos-ai-operator.fullname" . }}-readonly
  labels:
    {{- include "talos-ai-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "talos-ai-operator.fullname" . }}-readonly
subjects:
  - kind: ServiceAccount
    name: {{ include "talos-ai-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
