# MinIO — S3-compatible object store. The data plane: DuckDB writes the synthetic
# Parquet file here and then scans it back. Single node for the lab.
#
# Heads-up on MinIO (verified June 2026): the MinIO community edition went
# maintenance-mode and stopped publishing fresh container images in 2025
# (last tag: RELEASE.2025-09-07T16-13-09Z, which we pin below). It still runs and
# its S3 API is everywhere, but don't start new self-hosted work on it. Garage
# (dxflrs/garage) is the live, drop-in S3 alternative — see talos-data/ for that
# layout. We use MinIO here because the spec asked for it explicitly; the DuckDB
# query-runner pattern is identical against any S3-compatible endpoint.
#
# Ports: 9000 S3 API · 9001 console.
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: exp-duckdb-parquet
type: Opaque
stringData:
  # DEMO VALUES — plaintext on purpose for the lab. In real life: SealedSecrets /
  # SOPS / external secrets store, and a scoped key, not the root user.
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin"
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: exp-duckdb-parquet
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - name: s3-api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: exp-duckdb-parquet
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # Pinned: last community image MinIO published (publishing stopped 2025).
          image: minio/minio:RELEASE.2025-09-07T16-13-09Z
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef:
                name: minio-creds
          ports:
            - containerPort: 9000
              name: s3-api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # The 50M-row Parquet lands well under a GB, but leave headroom.
            storage: 10Gi
