# Postgres — the DuckLake CATALOG. This holds ALL table metadata: snapshots,
# schema history, the list of every Parquet data file, and (for tiny writes) even
# inlined data. It is the stateful heart of the lakehouse.
#
# This is the headline DuckLake property: the metadata is ROWS IN THIS DATABASE,
# not a tree of metadata.json/manifest files on object storage (that is Iceberg).
# Lose this Postgres and every Parquet object on MinIO becomes an orphan with no
# schema and no snapshot map. THIS is what a platform-sre review backs up first.
---
apiVersion: v1
kind: Secret
metadata:
  name: ducklake-pg
  namespace: exp-ducklake
type: Opaque
stringData:
  # DEMO password — change for anything real.
  POSTGRES_DB: ducklake
  POSTGRES_USER: ducklake
  POSTGRES_PASSWORD: ducklake
---
apiVersion: v1
kind: Service
metadata:
  name: ducklake-pg
  namespace: exp-ducklake
  labels:
    app: ducklake-pg
spec:
  selector:
    app: ducklake-pg
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ducklake-pg
  namespace: exp-ducklake
spec:
  serviceName: ducklake-pg
  replicas: 1
  selector:
    matchLabels:
      app: ducklake-pg
  template:
    metadata:
      labels:
        app: ducklake-pg
    spec:
      containers:
        - name: postgres
          image: postgres:17
          envFrom:
            - secretRef:
                name: ducklake-pg
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ducklake", "-d", "ducklake"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ducklake", "-d", "ducklake"]
            initialDelaySeconds: 15
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
