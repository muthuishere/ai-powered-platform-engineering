# Demo workloads for the resource-waste / right-sizing experiment.
#
# Three Deployments, all in namespace exp-resource-waste:
#
#   over-requester-a, over-requester-b
#     Request a FAT slice (1 CPU + 1Gi memory) per pod but do almost nothing —
#     a sleeping busybox idles at a few milli-cores and a few MiB RSS. This is the
#     "someone copy-pasted requests from a sizing guide and never measured" pattern
#     that the CAST AI report quantifies industry-wide (~8% CPU / ~20% mem used vs
#     requested). The scheduler RESERVES the full 1 CPU / 1Gi on a node for each of
#     these pods, so the gap between requested and used is pure stranded capacity.
#
#   right-sized
#     Requests a modest slice (50m CPU + 64Mi memory) for the same idle workload —
#     close to what an idle busybox actually consumes. Included as the control so
#     RESULTS.md can contrast "guessed big" vs "measured small" side by side.
#
# Images are pinned by digest-free tag on registry.k8s.io (mirrors widely cached).
# Nothing here needs network or storage; the experiment is about requests vs usage,
# not throughput.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: over-requester-a
  namespace: exp-resource-waste
  labels:
    app: over-requester-a
    exp.role: over-requester
spec:
  replicas: 1
  selector:
    matchLabels:
      app: over-requester-a
  template:
    metadata:
      labels:
        app: over-requester-a
        exp.role: over-requester
    spec:
      containers:
      - name: idle
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        command: ["sh", "-c", "while true; do sleep 3600; done"]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: over-requester-b
  namespace: exp-resource-waste
  labels:
    app: over-requester-b
    exp.role: over-requester
spec:
  replicas: 1
  selector:
    matchLabels:
      app: over-requester-b
  template:
    metadata:
      labels:
        app: over-requester-b
        exp.role: over-requester
    spec:
      containers:
      - name: idle
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        command: ["sh", "-c", "while true; do sleep 3600; done"]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: right-sized
  namespace: exp-resource-waste
  labels:
    app: right-sized
    exp.role: right-sized
spec:
  replicas: 1
  selector:
    matchLabels:
      app: right-sized
  template:
    metadata:
      labels:
        app: right-sized
        exp.role: right-sized
    spec:
      containers:
      - name: idle
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        command: ["sh", "-c", "while true; do sleep 3600; done"]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
