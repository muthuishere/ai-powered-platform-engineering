# A tiny, dependency-free HTTP server (Python stdlib only). Identical for both
# variants -- the ONLY independent variable in this spike is the presence of a
# PodDisruptionBudget. The server:
#   GET /        -> 200 "ok <POD_NAME>"   (the request clients count)
#   GET /healthz -> 200 (readiness/liveness)
# A short artificial startup delay (READY_DELAY_S) models a real app that needs
# a moment before it can serve -- this is what makes a too-aggressive drain
# (no PDB) actually drop requests: replacements aren't Ready yet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pdb-app
  namespace: exp-pdb-eviction
  labels:
    app.kubernetes.io/part-of: exp-pdb-eviction
data:
  app.py: |
    import os, time, http.server, socketserver, threading

    POD = os.environ.get("POD_NAME", "unknown")
    PORT = int(os.environ.get("PORT", "8080"))
    READY_DELAY_S = float(os.environ.get("READY_DELAY_S", "6"))

    START = time.time()
    def is_ready():
        return (time.time() - START) >= READY_DELAY_S

    class H(http.server.BaseHTTPRequestHandler):
        def _send(self, code, body):
            b = body.encode()
            self.send_response(code)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)
        def do_GET(self):
            if self.path == "/healthz":
                if is_ready():
                    self._send(200, "ready")
                else:
                    self._send(503, "starting")
                return
            self._send(200, "ok " + POD)
        def log_message(self, *a):
            pass

    class Srv(socketserver.ThreadingMixIn, http.server.HTTPServer):
        daemon_threads = True
        allow_reuse_address = True

    print("serving on", PORT, "pod", POD, "ready_delay", READY_DELAY_S, flush=True)
    Srv(("0.0.0.0", PORT), H).serve_forever()
