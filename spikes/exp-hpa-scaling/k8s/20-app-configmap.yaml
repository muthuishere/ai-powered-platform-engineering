# A tiny single-file HTTP server that burns CPU on demand.
#
#   GET /          -> 200 "ok"  (cheap; used for readiness)
#   GET /burn?ms=N -> spins a CPU busy-loop for ~N milliseconds, then 200
#
# The synthetic load generator hammers /burn so that each replica is pushed
# toward its CPU request, driving HPA to scale out. Stdlib only (python:3.12-slim),
# threaded so concurrent burns land on the one container's CPU budget.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cpu-burner-src
  namespace: exp-hpa-scaling
data:
  server.py: |
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import urlparse, parse_qs

    def burn(ms):
        # Busy CPU loop for ~ms milliseconds of wall time. Real CPU work, so it
        # shows up as container CPU usage for metrics-server. A microscopic
        # sleep(0) between chunks releases the GIL so the SAME server's readiness
        # handler ('/') can still be answered while burns are in flight — without
        # this, heavy concurrent burns starve readiness and the pod flaps
        # NotReady, which removes it from the HPA's metric set.
        end = time.perf_counter() + (ms / 1000.0)
        x = 0
        while time.perf_counter() < end:
            for _ in range(5000):
                x = (x * 1103515245 + 12345) & 0x7FFFFFFF
            time.sleep(0)  # yield the GIL
        return x

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            u = urlparse(self.path)
            if u.path == "/burn":
                q = parse_qs(u.query)
                ms = int(q.get("ms", ["50"])[0])
                burn(ms)
                body = b"burned\n"
            else:
                body = b"ok\n"
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *a):
            pass  # quiet

    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
