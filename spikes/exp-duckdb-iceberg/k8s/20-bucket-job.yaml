# One-time bucket bootstrap. Uses the MinIO client (mc) to create the bucket that
# will hold BOTH the Iceberg metadata tree and the Parquet data. Idempotent:
# `mc mb --ignore-existing` is a no-op if the bucket already exists.
#
# Unlike Garage (exp-ducklake), MinIO needs no layout step — once the server is
# healthy the root creds can make buckets immediately. We reuse the root creds as the
# app key for the lab; a real deployment would mint a scoped access key for the bucket.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket
  namespace: exp-duckdb-iceberg
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: minio-bucket
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-08T15-39-49Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_PASSWORD
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "waiting for minio to answer..."
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                sleep 2
              done
              mc mb --ignore-existing local/warehouse
              echo "bucket ready: warehouse"
              mc ls local
