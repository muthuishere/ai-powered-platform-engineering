# ApplicationSet: deploy ingress-nginx to EVERY cluster labelled
# environment=workload. The cluster generator lists clusters registered in
# ArgoCD; the template instantiates one Application per match. Register a 4th
# workload cluster later and it gets ingress-nginx automatically — no edits here.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            environment: workload
  template:
    metadata:
      name: 'ingress-nginx-{{.name}}'
    spec:
      project: default
      source:
        repoURL: https://kubernetes.github.io/ingress-nginx
        chart: ingress-nginx
        targetRevision: 4.11.3
        helm:
          valuesObject:
            controller:
              replicaCount: 1
              service:
                type: ClusterIP        # no cloud LB in a Docker-Talos spike
              admissionWebhooks:
                enabled: false         # skip the webhook job for a faster sync
              resources:
                requests: {cpu: 50m, memory: 90Mi}
      destination:
        server: '{{.server}}'
        namespace: ingress-nginx
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
