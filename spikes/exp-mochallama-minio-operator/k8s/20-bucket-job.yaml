apiVersion: batch/v1
kind: Job
metadata:
  name: minio-make-bucket
  namespace: exp-mochallama-minio
  labels:
    experiment: exp-mochallama-minio
    app.kubernetes.io/component: bucket-init
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: bucket-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          # `mc` (MinIO client) image carries the CLI we use everywhere here.
          image: quay.io/minio/mc:RELEASE.2025-04-03T17-07-56Z
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              export MC_CONFIG_DIR=/tmp/.mc
              echo "[bucket] waiting for MinIO S3 API at ${S3_ENDPOINT} ..."
              until mc alias set s3 "${S3_ENDPOINT}" "${AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY}" >/dev/null 2>&1; do
                sleep 2
              done
              echo "[bucket] ensuring bucket s3/${MODEL_BUCKET}"
              mc mb --ignore-existing "s3/${MODEL_BUCKET}"
              mc ls s3/
              echo "[bucket] done"
          env:
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef: { name: model-config, key: S3_ENDPOINT }
            - name: MODEL_BUCKET
              valueFrom:
                configMapKeyRef: { name: model-config, key: MODEL_BUCKET }
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: minio-creds, key: AWS_ACCESS_KEY_ID }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: minio-creds, key: AWS_SECRET_ACCESS_KEY }
          # mc writes its config under MC_CONFIG_DIR (set to /tmp/.mc in args) so
          # readOnlyRootFilesystem holds.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
