apiVersion: v1
kind: ConfigMap
metadata:
  name: model-config
  namespace: exp-mochallama-minio
  labels:
    experiment: exp-mochallama-minio
    app.kubernetes.io/component: model
# Single source of truth for "which model lives in our S3". The upload Job PUTs
# this file; the operator's initContainer GETs the same key. Change these three
# values to serve a different model from the SAME image (one image, many models).
data:
  # Small, tool-capable, CPU-runnable model for the lab.
  MODEL_FILENAME: "qwen2.5-1.5b-instruct-q4_k_m.gguf"
  MODEL_URL: "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
  # Bucket + key layout inside MinIO: s3/<BUCKET>/<MODEL_FILENAME>
  MODEL_BUCKET: "models"
  # S3 endpoint (in-cluster). `mc` alias is created against this.
  S3_ENDPOINT: "http://minio:9000"
