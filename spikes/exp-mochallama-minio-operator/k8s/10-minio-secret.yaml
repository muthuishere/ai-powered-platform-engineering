apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: exp-mochallama-minio
  labels:
    experiment: exp-mochallama-minio
    app.kubernetes.io/component: object-store
type: Opaque
# Lab credentials ONLY. In a real "sovereign operator" deployment these come from
# a sealed/external secret (or your cloud S3 IAM); never commit live keys.
stringData:
  # MinIO root user/password (server side).
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin123"
  # The access/secret the bucket Job, upload Job and initContainer use via `mc`.
  # In the lab these equal the root creds; split them for a real deployment.
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin123"
