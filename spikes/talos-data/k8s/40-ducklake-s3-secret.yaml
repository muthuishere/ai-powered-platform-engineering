# S3 credentials for the demo, consumed by the demo Job. These come from the
# garage-bootstrap Job output (`garage key info ... --show-secret`). The values
# below are PLACEHOLDERS — replace KEY_ID / SECRET with the real key before
# applying, or you'll get 403s from Garage.
#
# In a real GitOps flow this would be a SealedSecret / SOPS-encrypted Secret, never
# committed in plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: ducklake-s3
  namespace: talos-data
type: Opaque
stringData:
  S3_KEY_ID: "REPLACE_WITH_GARAGE_KEY_ID"
  S3_SECRET: "REPLACE_WITH_GARAGE_SECRET"
  S3_ENDPOINT: "garage:3900"
  S3_USE_SSL: "false"
  S3_BUCKET: "ducklake"
