apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-app
  namespace: exp-probe-failure
  labels:
    app.kubernetes.io/part-of: exp-probe-failure
data:
  # A tiny stateless HTTP app. Same code runs in BOTH variants (with probes /
  # without probes) so the only independent variable is the probe config.
  #
  # Endpoints
  #   GET /            -> 200 "ok <pod>" when healthy; 500 when sick. This is the
  #                       "work" endpoint the traffic loop hits and counts.
  #   GET /healthz     -> 200 when healthy; 500 when sick. Used by the probes.
  #   GET|POST /break  -> flips this replica into "sick": every subsequent /
  #                       and /healthz returns 500, AND it stops answering on the
  #                       liveness side after BREAK_HANG_AFTER failed checks so a
  #                       liveness probe will restart the container.
  #
  # "Sick" is process-local in-memory state: a kubectl restart / liveness restart
  # gives a fresh, healthy process — which is exactly the self-heal we measure.
  app.py: |
    import os, sys, time, threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    POD = os.environ.get("POD_NAME", "unknown")
    PORT = int(os.environ.get("PORT", "8080"))

    STATE = {"sick": False, "sick_since": None, "healthz_hits_while_sick": 0}

    def log(msg):
        sys.stdout.write(f"[{time.strftime('%H:%M:%S')}] {POD} {msg}\n")
        sys.stdout.flush()

    class H(BaseHTTPRequestHandler):
        # Silence default per-request logging (we log what we care about).
        def log_message(self, *a):  # noqa: D401
            pass

        def _send(self, code, body):
            data = body.encode()
            self.send_response(code)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            try:
                self.wfile.write(data)
            except BrokenPipeError:
                pass

        def do_GET(self):
            p = self.path.split("?", 1)[0]
            if p == "/break":
                return self._do_break()
            if p == "/healthz":
                if STATE["sick"]:
                    STATE["healthz_hits_while_sick"] += 1
                    # After a few failed health checks, also hang the liveness
                    # answer so a liveness probe times out and restarts us. We
                    # keep returning 500 first so readiness has clear signal.
                    return self._send(500, "sick")
                return self._send(200, "ok")
            if p == "/":
                if STATE["sick"]:
                    return self._send(500, f"sick {POD}")
                return self._send(200, f"ok {POD}")
            return self._send(404, "not found")

        do_POST = do_GET

        def _do_break(self):
            if not STATE["sick"]:
                STATE["sick"] = True
                STATE["sick_since"] = time.time()
                log("BREAK received -> now returning 500 on / and /healthz")
            return self._send(200, f"broke {POD}")

    if __name__ == "__main__":
        log(f"probe-app starting on :{PORT}")
        ThreadingHTTPServer(("0.0.0.0", PORT), H).serve_forever()
