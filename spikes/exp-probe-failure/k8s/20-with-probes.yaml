# Variant A: the SAME app, WITH proper readiness + liveness probes.
#   readinessProbe  -> a sick replica is pulled from the Service endpoints fast,
#                      so traffic stops hitting it (low bad-request count).
#   livenessProbe   -> a sick replica's container is restarted, so it self-heals
#                      back to a fresh, healthy process.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-with-probes
  namespace: exp-probe-failure
  labels:
    app: app-with-probes
    variant: with-probes
    app.kubernetes.io/part-of: exp-probe-failure
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app-with-probes
  template:
    metadata:
      labels:
        app: app-with-probes
        variant: with-probes
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: python:3.12-slim
          command: ["python3", "/app/app.py"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: probe-app
---
apiVersion: v1
kind: Service
metadata:
  name: app-with-probes
  namespace: exp-probe-failure
  labels:
    app: app-with-probes
    app.kubernetes.io/part-of: exp-probe-failure
spec:
  selector:
    app: app-with-probes
  ports:
    - name: http
      port: 80
      targetPort: http
